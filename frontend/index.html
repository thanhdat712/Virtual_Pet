<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pixel.css">
</head>

<body>
    <main class="pet-game" aria-label="Màn hình chăm sóc thú cưng">
        <div class="lobby-scene" id="lobby-scene" aria-hidden="true"></div>
        <div class="lobby-floor" id="lobby-floor" aria-hidden="true"></div>
        <section class="px-box hud-player" aria-label="Thông tin thú cưng">
            <div class="hud-avatar"><img src="assets/pets/meomeo.png" alt="PetLovery"></div>
            <div class="hud-player-info">
                <p class="hud-level-row"><span class="px-icon" data-px="star"></span><span>Lv. <b id="pet-level">1</b></span><span class="hud-name" id="pet-name">UIA</span></p>
                <div class="px-bar exp"><i id="exp-fill" style="width:0%"></i></div>
                <p class="hud-exp-text" id="exp-text">EXP 0 / 100</p>
            </div>
        </section>

        <section class="px-box hud-weather" aria-label="Thời tiết và giờ">
            <span class="px-icon big" id="hud-weather-icon" data-px="sun"></span>
            <div><b id="hud-weather-label">Sunny</b><span id="hud-clock">00:00</span></div>
        </section>

        <section class="px-box hud-coins" aria-label="Tiền tệ">
            <span class="px-icon" data-px="coin"></span><span>Coins</span><b id="coin-balance">100</b>
        </section>

        <section class="px-box hud-happy" aria-label="Happiness">
            <div class="hud-stat" data-stat="happiness" title="Fill the bar to level up">
                <span class="px-icon big" data-px="heart"></span>
                <span class="hud-stat-name">Happiness</span>
                <div class="px-bar"><i style="width:85%"></i></div>
                <b class="hud-stat-value">85 / 100</b>
            </div>
        </section>

        <section class="px-box hud-vitals" aria-label="Chỉ số thú cưng">
            <div class="hud-stat" data-stat="energy">
                <span class="px-icon big" data-px="bolt"></span>
                <span class="hud-stat-name">Energy</span>
                <div class="px-bar"><i style="width:70%"></i></div>
                <b class="hud-stat-value">70 / 100</b>
            </div>
            <div class="hud-stat" data-stat="hunger">
                <span class="px-icon big" data-px="utensils"></span>
                <span class="hud-stat-name">Hunger</span>
                <div class="px-bar"><i style="width:30%"></i></div>
                <b class="hud-stat-value">30 / 100</b>
            </div>
        </section>

        <section class="pet-stage" aria-label="UIA">
            <div class="pet-name">UIA</div>
            <img class="pet-image" src="assets/pets/meomeo_mulen.png" alt="UIA, thú cưng của bạn">
        </section>

        <section class="px-box hud-training" aria-label="Huấn luyện">
            <header class="px-head"><span class="px-icon" data-px="dumbbell"></span>Training</header>
            <button class="train-row" id="study-btn" type="button">
                <span class="px-icon big" data-px="book"></span>
                <span class="train-name">Study</span>
            </button>
            <button class="train-row" id="practice-btn" type="button">
                <span class="px-icon big" data-px="code"></span>
                <span class="train-name">Practice</span>
            </button>
        </section>

        <nav class="hud-care" aria-label="Các hành động chính">
            <button class="px-card care-eat" id="open-food" type="button" aria-expanded="false" aria-controls="food-drawer">
                <span class="px-card-head"><span class="px-icon" data-px="utensils"></span>Eat</span>
                <span class="px-card-body"><span class="px-icon huge" data-px="bowl"></span></span>
            </button>
            <button class="px-card care-sleep" id="sleep-pet" type="button">
                <span class="px-card-head"><span class="px-icon" data-px="moon"></span>Sleep</span>
                <span class="px-card-body"><span class="px-icon huge" data-px="bed"></span></span>
            </button>
        </nav>

        <aside class="food-drawer glass-card" id="food-drawer" aria-label="Food" hidden>
            <header><h2>Food</h2><button id="close-food" type="button" aria-label="Close food">&times;</button></header>
            <div id="food-list"></div>
        </aside>
        <p class="feeding-status" id="feeding-status" role="status" aria-live="polite"></p>

        <nav class="px-box hud-tools" aria-label="Điều hướng nhanh">
            <button class="tool-btn" id="open-shop" type="button" title="Shop" aria-label="Shop" aria-haspopup="dialog" aria-controls="shop-panel"><span class="px-icon big" data-px="bag"></span></button>
            <button class="tool-btn" id="open-inventory" type="button" title="Inventory" aria-label="Inventory" aria-haspopup="dialog" aria-controls="inventory-panel"><span class="px-icon big" data-px="backpack"></span></button>
            <button class="tool-btn" id="open-decorate" type="button" title="Decorate" aria-label="Decorate" aria-haspopup="dialog" aria-controls="decorate-panel"><span class="px-icon big" data-px="brush"></span></button>
        </nav>

        <p class="px-box hud-hint"><span class="px-icon big" data-px="paw"></span><span>Take care of your pet!</span><span class="px-icon" data-px="heart"></span></p>

        <section class="win-backdrop" id="inventory-panel" lang="en" role="dialog" aria-modal="true" aria-labelledby="inventory-title" aria-label="Bag" hidden>
            <div class="win">
                <div class="win-main">
                    <header class="win-head">
                        <span class="px-icon huge" data-px="backpack"></span>
                        <h1 id="inventory-title">Bag</h1>
                        <span class="win-count" id="inventory-count" aria-live="polite"></span>
                        <button class="win-close" id="close-inventory" type="button" aria-label="Close bag">×</button>
                    </header>
                    <div class="win-tabs" role="group" aria-label="Filter bag items">
                        <button class="win-tab is-active" type="button" data-filter="all" aria-pressed="true">All</button>
                        <button class="win-tab" type="button" data-filter="food" aria-pressed="false">Food</button>
                        <button class="win-tab" type="button" data-filter="decoration" aria-pressed="false">Decor</button>
                    </div>
                    <div class="win-body"><div class="bag-grid" id="inventory-grid"></div></div>
                    <footer class="win-detail" id="inventory-detail"></footer>
                </div>
            </div>
        </section>

        <section class="win-backdrop" id="shop-panel" lang="en" role="dialog" aria-modal="true" aria-labelledby="shop-title" aria-label="Shop" hidden>
            <div class="win">
                <div class="win-main">
                    <header class="win-head">
                        <span class="px-icon huge" data-px="bag"></span>
                        <h1 id="shop-title">Shop</h1>
                        <button class="win-close" id="close-shop" type="button" aria-label="Close shop">×</button>
                    </header>
                    <div class="win-tabs" role="group" aria-label="Filter shop items">
                        <button class="win-tab is-active" type="button" data-shop-filter="food" aria-pressed="true">Food</button>
                        <button class="win-tab" type="button" data-shop-filter="headwear" aria-pressed="false">Headwear</button>
                        <button class="win-tab" type="button" data-shop-filter="background" aria-pressed="false">Background</button>
                        <button class="win-tab" type="button" data-shop-filter="floor" aria-pressed="false">Floor</button>
                    </div>
                    <div class="win-body"><div class="shop-list" id="shop-grid"></div></div>
                    <footer class="win-foot">
                        <p class="win-message" id="shop-message" role="status" aria-live="polite"></p>
                        <span class="win-coins"><span class="px-icon" data-px="coin"></span><b id="shop-coin-balance">100</b></span>
                    </footer>
                </div>
            </div>
        </section>

        <section class="win-backdrop" id="decorate-panel" lang="en" role="dialog" aria-modal="true" aria-labelledby="decorate-title" aria-label="Decorate" hidden>
            <div class="win">
                <div class="win-main">
                    <header class="win-head">
                        <span class="px-icon huge" data-px="brush"></span>
                        <h1 id="decorate-title">Decorate</h1>
                        <button class="win-close" id="close-decorate" type="button" aria-label="Close decorate">×</button>
                    </header>
                    <div class="win-tabs" role="group" aria-label="Choose decoration slot">
                        <button class="win-tab is-active" type="button" data-decor-slot="background" aria-pressed="true">Background</button>
                        <button class="win-tab" type="button" data-decor-slot="floor" aria-pressed="false">Floor</button>
                    </div>
                    <div class="win-body"><div class="bag-grid" id="decorate-grid"></div></div>
                    <footer class="win-foot">
                        <p class="win-message" id="decorate-hint" aria-live="polite"></p>
                    </footer>
                </div>
            </div>
        </section>
    </main>
    <script src="js/pixel.js" defer></script>
    <script src="js/demo.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/session.js" defer></script>
</body>

</html>
