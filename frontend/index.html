<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="pet-game" aria-label="Màn hình chăm sóc thú cưng">
        <section class="player-card glass-card" aria-label="Thông tin thú cưng">
            <div class="avatar"><img src="assets/pets/cat1.png" alt="PetLovery"></div>
            <div>
                <p>Nickname: <strong>PetLovery</strong></p>
                <p>Level: <strong>15</strong></p>
            </div>
        </section>
        <section class="stats-card glass-card" aria-label="Chỉ số thú cưng">
            <div class="stat">
                <div class="stat-line"><span>♥ Health:</span><b>90%</b></div>
                <div class="meter green"><i style="width:90%"></i></div>
            </div>
            <div class="stat">
                <div class="stat-line"><span>☻ Happiness:</span><b>85%</b></div>
                <div class="meter yellow"><i style="width:85%"></i></div>
            </div>
            <div class="stat">
                <div class="stat-line"><span>◒ Hunger:</span><b>30%</b></div>
                <div class="meter orange"><i style="width:30%"></i></div>
            </div>
            <div class="stat">
                <div class="stat-line"><span>ϟ Energy:</span><b>70%</b></div>
                <div class="meter purple"><i style="width:70%"></i></div>
            </div>
        </section>
        <section class="currency" aria-label="Tiền tệ">
            <div class="currency-row glass-card"><span class="coin">$</span><span>Coins:</span><b>VND</b></div>
            <div class="currency-row glass-card"><span class="gem">◆</span><span>Gems:</span><b>D</b></div>
        </section>
        <button class="quest-card glass-card" type="button"
            aria-label="Nhiệm vụ hằng ngày"><span>📜</span><b>Daily<br>Quests</b></button>
        <section class="pet-stage" aria-label="Fluffy">
            <div class="pet-name">Fluffy</div><img class="pet-image" src="assets/pets/cat2.png"
                alt="Fluffy, thú cưng của bạn">
        </section>
        <section class="training" aria-label="Huấn luyện"><span class="section-tag">TRAINING</span>
            <div class="training-actions glass-card">
                <div class="training-row">
                    <div class="training-item">
                        <button class="round-button exercise" type="button">🏋</button>
                        <b class="study-text">Study</b>
                    </div>
                    <div class="training-item">
                        <button class="round-button practice" type="button">🎯</button>
                        <b class="practice-text">Practice</b>
                    </div>
                </div>
            </div>
        </section>
        <nav class="main-actions glass-card" aria-label="Các hành động chính">
            <button class="action feed" type="button"><span>🥣</span><b>Feed</b></button><button class="action play"
                type="button"><span>🎾</span><b>Play</b></button><button class="action sleep"
                type="button"><span>🛏</span><b>Sleep</b></button><button class="action bath"
                type="button"><span>🛁</span><b>Bath</b></button>
        </nav>
        <nav class="quick-actions glass-card" aria-label="Điều hướng nhanh">
            <button class="action shop" type="button"><span>🛒</span><b>Shop</b></button><button
                class="action inventory" type="button"><span>🎒</span><b>Inventory</b></button><button
                class="action decorate" type="button"><span>🖌</span><b>Decorate</b></button>
        </nav>
    </main>
</body>

</html>
